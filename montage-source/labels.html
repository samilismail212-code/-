<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Kufi;src:url(node_modules/@fontsource-variable/noto-kufi-arabic/files/noto-kufi-arabic-arabic-wght-normal.woff2) format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;font-family:Kufi,sans-serif;overflow:hidden}
.o{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:330px}
.lt{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,rgba(13,53,84,.96),rgba(7,31,51,.96));color:#f4f0e6;font-size:58px;font-weight:800;line-height:1.5;padding:16px 46px 24px 40px;border-radius:26px;border-right:12px solid #c9a45c;box-shadow:0 14px 36px rgba(0,0,0,.45),0 0 0 2px rgba(201,164,92,.55)}
.lt b{color:#e6cd94}
.lt .dot{width:18px;height:18px;border-radius:50%;background:#e6cd94;flex:none;margin-top:8px}
#wm{align-items:flex-start;justify-content:flex-start;padding:120px 46px 0 0}
.med{position:relative;width:170px;height:170px;border-radius:50%;overflow:hidden;background:#f4f0e6;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 4px #c9a45c}
.med img{position:absolute;width:194.3px;left:-12.4px;top:-9.7px}
.vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,31,51,.45) 0,transparent 16%,transparent 70%,rgba(7,31,51,.55) 100%)}
.fr{position:absolute;inset:26px;border:3px solid rgba(201,164,92,.75);border-radius:30px}
</style></head><body>
<div class="o" id="wm"><div class="vig"></div><div class="fr"></div><div class="med"><img src="logo.jpg"></div></div>
<div class="o"><div class="lt"><span class="dot"></span>تشكيلة <b>دفاتر المدرّسين</b></div></div>
<div class="o"><div class="lt"><span class="dot"></span>دفاتر الخطة <b>اليومية والسنوية</b></div></div>
<div class="o"><div class="lt"><span class="dot"></span>خطة يومية <b>•</b> خطة سنوية</div></div>
<div class="o"><div class="lt"><span class="dot"></span>دفتر <b>الخطة للمدرّس</b></div></div>
<div class="o"><div class="lt"><span class="dot"></span>دفاتر <b>سبايرول</b></div></div>
<div class="o"><div class="lt"><span class="dot"></span>متوفرة <b>للدراسة العربية</b></div></div>
<div class="o"><div class="lt"><span class="dot"></span>وللدراسة <b>الكوردية</b></div></div>
<div class="o"><div class="lt"><span class="dot"></span>متوفرة الآن في <b>مكتب القيثارة</b></div></div>
